{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ include "data-ingestion-agent.namespace" . }}
  labels:
    {{- include "data-ingestion-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ .Values.secret.postgresDsn | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.secret.clickhousePassword | quote }}
  QDRANT_API_KEY: {{ .Values.secret.qdrantApiKey | quote }}
  REDIS_PASSWORD: {{ .Values.secret.redisPassword | quote }}
{{- end }}

