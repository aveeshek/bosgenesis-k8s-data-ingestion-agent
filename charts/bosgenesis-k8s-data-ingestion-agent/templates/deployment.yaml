apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-ingestion-agent.name" . }}
  namespace: {{ include "data-ingestion-agent.namespace" . }}
  labels:
    {{- include "data-ingestion-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "data-ingestion-agent.name" . }}
  template:
    metadata:
      annotations:
        bosgenesis.io/rollout-timestamp: {{ .Values.rolloutTimestamp | quote }}
      labels:
        app.kubernetes.io/name: {{ include "data-ingestion-agent.name" . }}
        app.kubernetes.io/part-of: bosgenesis
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - {{ .Values.runtimeMode | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "data-ingestion-agent.name" . }}-config
            - secretRef:
                name: {{ .Values.secret.name }}
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
