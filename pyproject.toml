[project]
name = "bosgenesis-k8s-data-ingestion-agent"
version = "0.1.0"
description = "Read-only Kubernetes and Helm operational data ingestion agent for BOS Genesis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "BOS Genesis" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.2",
  "python-json-logger>=2.0.7",
  "psycopg[binary]>=3.2.0",
  "clickhouse-connect>=0.8.0",
  "qdrant-client>=1.12.0",
  "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
bosgenesis-k8s-data-ingestion-agent = "bosgenesis_k8s_data_ingestion_agent.entrypoints.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bosgenesis_k8s_data_ingestion_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "e2e: in-process end-to-end flow tests",
  "live_e2e: opt-in tests that require live BOS Genesis services",
]
